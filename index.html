<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Haldi Kumkum Resort - A Sanctuary of Heritage and Warmth</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Montserrat:wght@500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #070504;
      color: #f7f4ee;
      font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow-x: hidden;
      overscroll-behavior: none;
      user-select: none;
      -webkit-user-select: none;
    }

    /* 1000vh SCROLL TRACK FOR BUTTERY INERTIAL SCRUBBING */
    .scroll-container {
      width: 100%;
      height: 1000vh;
      position: relative;
      pointer-events: none;
    }

    /* FIXED CINEMATIC VIEWPORT */
    .viewport-stage {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background: #070504;
    }

    /* MASTER HARDWARE-ACCELERATED RETINA CANVAS */
    #drone-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      will-change: transform;
    }

    /* LUXURY PASTEL CINEMATIC VIGNETTE */
    .cinema-vignette {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 12;
      background: radial-gradient(circle at 50% 50%, transparent 68%, rgba(7, 5, 4, 0.42) 100%);
    }

    /* SUBTLE PROGRESS BAR */
    .tour-progress-track {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 3px;
      background: rgba(255, 245, 235, 0.08);
      z-index: 50;
      pointer-events: none;
    }

    .tour-progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #d8baa1 0%, #f4e8db 50%, #e2c2a9 100%);
      box-shadow: 0 0 10px rgba(230, 200, 175, 0.7);
      will-change: width;
    }

    /* SCROLL HINT (Disappears on first interaction) */
    .scroll-hint {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 40;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      pointer-events: none;
      transition: opacity 0.6s ease;
    }

    .scroll-hint-line {
      width: 1px;
      height: 28px;
      background: linear-gradient(to bottom, rgba(245, 235, 220, 0.85), transparent);
      animation: scroll-bob 2.2s infinite ease-in-out;
    }

    @keyframes scroll-bob {
      0% { transform: scaleY(0); transform-origin: top; }
      50% { transform: scaleY(1); transform-origin: top; }
      50.1% { transform: scaleY(1); transform-origin: bottom; }
      100% { transform: scaleY(0); transform-origin: bottom; }
    }

    /* ==========================================================================
       TICKET 2: LUXURY FLOATING NAVIGATION BAR (PAGE 2)
       ========================================================================== */
    .navbar-wrapper {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 100;
      pointer-events: none;
      display: flex;
      justify-content: center;
      transition: opacity 0.2s ease-out;
      opacity: 0;
    }

    .navbar-pill {
      width: 92vw;
      max-width: 1720px;
      height: 64px;
      background: #e0ceca;
      box-shadow: 0 10px 32px rgba(18, 12, 8, 0.24);
      border-radius: 0 0 20px 20px;
      padding: 0 clamp(20px, 3vw, 44px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      pointer-events: auto;
    }

    .nav-brand-slot {
      width: 70px;
      height: 40px;
      position: relative;
      flex-shrink: 0;
    }

    .nav-links-group {
      display: flex;
      align-items: center;
      gap: 36px;
      list-style: none;
    }

    .nav-link-item {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.13em;
      text-transform: uppercase;
      color: #2b221d;
      text-decoration: none;
      transition: color 0.25s ease, transform 0.25s ease;
      position: relative;
      cursor: pointer;
    }

    .nav-link-item:hover {
      color: #8c674e;
      transform: translateY(-1px);
    }

    .nav-link-item.active {
      font-weight: 800;
      color: #120c08;
    }

    .nav-menu-btn {
      font-size: 13.5px;
      font-weight: 800;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #120c08;
      cursor: pointer;
      padding: 8px 12px;
      border-radius: 6px;
      transition: background 0.2s ease, color 0.2s ease;
    }

    .nav-menu-btn:hover {
      background: rgba(18, 12, 8, 0.07);
    }

    /* ==========================================================================
       TICKET 1 & 3: HERO BRANDING OVERLAY & MORPHING LOGO
       ========================================================================== */
    .morph-logo-container {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 120;
      pointer-events: none;
      will-change: transform, width, height;
      transform-origin: top left;
    }

    .morph-logo-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      filter: drop-shadow(0 4px 18px rgba(0, 0, 0, 0.35));
    }

    .hero-tagline {
      position: fixed;
      left: 50%;
      top: 50.5%;
      transform: translate3d(-50%, 0, 0);
      text-align: center;
      pointer-events: none;
      z-index: 110;
      font-family: 'Playfair Display', Georgia, serif;
      font-style: italic;
      font-size: clamp(1.2rem, 2.3vw, 1.85rem);
      letter-spacing: 0.05em;
      color: #1a1411; /* Shades of rich heritage black */
      text-shadow: 0 1px 2px rgba(255, 255, 255, 0.38), 0 0 1px rgba(0, 0, 0, 0.15);
      width: 90%;
      max-width: 900px;
      will-change: opacity, transform;
      transition: opacity 0.15s ease-out;
    }

    @media (max-width: 992px) {
      .navbar-pill {
        width: 94vw;
        padding: 0 20px;
        height: 60px;
        border-radius: 0 0 16px 16px;
      }
      .nav-links-group {
        gap: 18px;
      }
      .nav-link-item {
        font-size: 11px;
        letter-spacing: 0.09em;
      }
      .nav-brand-slot {
        width: 55px;
        height: 34px;
      }
      .hero-tagline {
        top: 49%;
        font-size: 1.15rem;
      }
    }

    @media (max-width: 768px) {
      .nav-links-group {
        display: none;
      }
      .navbar-pill {
        width: 95vw;
        padding: 0 16px;
        height: 54px;
      }
      .nav-brand-slot {
        width: 48px;
        height: 30px;
      }
      .hero-tagline {
        top: 48%;
        font-size: 1.05rem;
      }
    }
  </style>
</head>
<body>

  <!-- 1000vh SCROLL CONTAINER -->
  <div class="scroll-container" id="scroll-container"></div>

  <!-- FIXED CINEMATIC VIEWPORT STAGE -->
  <main class="viewport-stage" id="viewport-stage">
    <!-- MASTER DRONE CANVAS -->
    <canvas id="drone-canvas"></canvas>

    <!-- CINEMA VIGNETTE -->
    <div class="cinema-vignette"></div>

    <!-- TICKET 2: LUXURY FLOATING NAVIGATION BAR -->
    <header class="navbar-wrapper" id="navbar-wrapper">
      <nav class="navbar-pill" id="navbar-pill">
        <div class="nav-brand-slot" id="nav-brand-slot"></div>
        <ul class="nav-links-group" id="nav-links-group">
          <li><a class="nav-link-item active" href="#home">HOME</a></li>
          <li><a class="nav-link-item" href="#story">OUR STORY</a></li>
          <li><a class="nav-link-item" href="#accommodation">ACCOMMODATION</a></li>
          <li><a class="nav-link-item" href="#amenities">AMENITIES</a></li>
          <li><a class="nav-link-item" href="#wedding">ROYAL WEDDING</a></li>
        </ul>
        <div class="nav-menu-btn" id="nav-menu-btn">MENU</div>
      </nav>
    </header>

    <!-- TICKET 1 & 3: MORPHING BRAND LOGO -->
    <div class="morph-logo-container" id="morph-logo-container">
      <img src="img/logo_official.png" alt="Haldi Kumkum Resort" class="morph-logo-img" id="morph-logo-img">
    </div>

    <!-- TICKET 1: LUXURY HERO TAGLINE -->
    <div class="hero-tagline" id="hero-tagline">
      A Sanctuary of Heritage and Warmth
    </div>

    <!-- SCROLL HINT -->
    <div class="scroll-hint" id="scroll-hint">
      <div class="scroll-hint-line"></div>
    </div>

    <!-- PROGRESS BAR -->
    <div class="tour-progress-track">
      <div class="tour-progress-fill" id="tour-progress-fill"></div>
    </div>
  </main>

  <!-- DEEP SCROLLYTELLING ENGINE & HERO MORPH CONTROLLER -->
  <script src="js/scrolly_player.js"></script>
  <script src="js/hero_morph.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // 1. Mount Hero Morph Controller
      const morph = HeroMorphController.mount({
        logo: '#morph-logo-container',
        tagline: '#hero-tagline',
        navbar: '#navbar-wrapper',
        navSlot: '#nav-brand-slot',
        transitionEnd: 0.14
      });

      // 2. Mount Scrollytelling Player with frame-accurate progress hook
      ScrollyPlayer.mount('#drone-canvas', {
        totalFrames: 600,
        frameUrl: (idx) => `frames_webp/frame_${String(idx).padStart(4, '0')}.webp?v=6`,
        scrollContainer: '#scroll-container',
        progressTrack: '#tour-progress-fill',
        scrollHint: '#scroll-hint',
        lerpDamping: 0.088,
        onProgress: (progress) => {
          morph.update(progress);
        }
      });
    });
  </script>
</body>
</html>
